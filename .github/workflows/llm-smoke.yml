name: LLM Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - name: Groq classify smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MAX_CALLS_PER_DAY: '99999'
          CLAUDE_MAX_CALLS_PER_RUN: '99999'
        run: |
          python <<'PY'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          assert os.environ.get('ANTHROPIC_API_KEY', '').startswith('gsk_'), 'secret missing or not groq'
          import scrape_jobs as s
          s.CLAUDE_MAX_CALLS_PER_DAY = 99999
          s.CLAUDE_MAX_CALLS_PER_RUN = 99999
          s._claude_calls_today = 0
          s._claude_calls_this_run = 0
          assert 'groq.com' in s.LLM_API_URL
          text = s._llm_complete('Reply with exactly: {"ok":1}', 200)
          assert '{"ok":1}' in text, text
          out = s.batch_classify_with_claude(
              ['Software Engineer Intern - Summer 2027', 'Barista'],
              board='summer',
          )
          assert out['software engineer intern - summer 2027']['is_tech']
          assert out['software engineer intern - summer 2027']['a'] == 1
          assert not out['barista']['is_tech']
          print('GROQ_SMOKE_PASS', s.CLAUDE_MODEL, 'calls=', s._claude_calls_this_run)
          PY
