name: Scrape Job Boards

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      board_group:
        description: 'Single board group to run (leave blank for all)'
        required: false
        default: ''

# Per board_group so workflow_dispatch of ashby/ukg/other don't cancel each other.
# Scheduled runs (empty board_group) still share one "all" slot.
concurrency:
  group: scrape-jobs-${{ github.event.inputs.board_group || 'all' }}
  cancel-in-progress: false

jobs:
  scrape-greenhouse:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'greenhouse' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Scrape Greenhouse
        timeout-minutes: 55
        env:
          BOARD_GROUP: greenhouse
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_greenhouse.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_greenhouse.json \
            .github/data/followed_companies.json \
            .github/data/pending_greenhouse.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: greenhouse"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-ashby:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'ashby' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Scrape Ashby
        timeout-minutes: 45
        env:
          BOARD_GROUP: ashby
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_ashby.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_ashby.json \
            .github/data/pending_ashby.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: ashby"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-workday:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'workday' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialize shards so CXS is not hammered by parallel runners.
      max-parallel: 1
      matrix:
        shard: [0, 1, 2]
    # Schedule + manual workday dispatch must not hammer CXS at the same time.
    concurrency:
      group: scrape-workday-cxs
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          # Latest main so sequential shards see prior shard commits.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Scrape Workday shard ${{ matrix.shard }}
        timeout-minutes: 50
        env:
          BOARD_GROUP: workday
          WORKDAY_MAX_WORKERS: '2'
          WORKDAY_SHARD: ${{ matrix.shard }}
          WORKDAY_SHARD_COUNT: '3'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        if: success() || failure()
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          git add \
            .github/data/seen_jobs_workday.json \
            .github/data/seen_jobs_workday_*.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_workday.json \
            .github/data/pending_workday.json \
            .github/data/pending_workday_*.json \
            2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: workday shard ${{ matrix.shard }}"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-linkedin-amazon:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'linkedin_amazon' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Scrape LinkedIn, Amazon, and Google Careers
        timeout-minutes: 55
        env:
          BOARD_GROUP: linkedin_amazon
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_linkedin_amazon.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_linkedin_amazon.json \
            .github/data/pending_linkedin_amazon.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: linkedin_amazon"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-oracle:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'oracle' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Scrape Oracle HCM
        timeout-minutes: 55
        env:
          BOARD_GROUP: oracle
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_oracle.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_oracle.json \
            .github/data/pending_oracle.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: oracle"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-other:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'other' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Scrape Lever / SmartRecruiters / Workable / Recruitee / Pinpoint / iCIMS / Avature / Breezy / Dover / Phenom / Careers portals / ApplyToJob
        timeout-minutes: 75
        env:
          BOARD_GROUP: other
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_other.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_other.json \
            .github/data/pending_other.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: other"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-ukg:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'ukg' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Verify UKG boards reachable
        env:
          BOARD_GROUP: ukg
        run: python .github/scripts/check_ats_boards.py
      - name: Scrape UKG / UltiPro
        timeout-minutes: 55
        env:
          BOARD_GROUP: ukg
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_ukg.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_ukg.json \
            .github/data/pending_ukg.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: ukg"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  scrape-bamboohr:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.board_group == '' || github.event.inputs.board_group == 'bamboohr' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Verify BambooHR boards reachable
        env:
          BOARD_GROUP: bamboohr
        run: python .github/scripts/check_ats_boards.py
      - name: Scrape BambooHR
        timeout-minutes: 30
        env:
          BOARD_GROUP: bamboohr
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIORITY_ALERT_WEBHOOK_URL: ${{ secrets.PRIORITY_ALERT_WEBHOOK_URL }}
        run: python .github/scripts/scrape_jobs.py
      - name: Commit data files
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          for f in \
            .github/data/seen_jobs_bamboohr.json \
            .github/data/title_classifications.json \
            .github/data/claude_usage_bamboohr.json \
            .github/data/pending_bamboohr.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "scraper data: bamboohr"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi

  apply:
    needs: [scrape-greenhouse, scrape-ashby, scrape-workday, scrape-oracle, scrape-linkedin-amazon, scrape-other, scrape-ukg, scrape-bamboohr]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml anthropic
      - name: Apply pending discoveries to listings.json
        run: python .github/scripts/apply_pending.py
      - name: Commit listings and README
        run: |
          git config user.name "baldmeya"
          git config user.email "akannan8@umd.edu"
          git add listings.json README.md SUMMER.md OFFCYCLE.md NEWGRAD.md .github/data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "add auto-discovered listings and update scraper data"
            for i in 1 2 3 4 5; do git pull --rebase -X ours && git push && break; sleep $((i*5)); done
          fi
