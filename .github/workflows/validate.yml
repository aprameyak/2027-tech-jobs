name: Validate Listings

on:
  push:
    branches: [main]
    paths:
      - 'listings.json'
      - 'SUMMER.md'
      - 'OFFCYCLE.md'
      - 'NEWGRAD.md'
      - 'README.md'
      - '.github/scripts/validate_listings.py'
      - '.github/scripts/quality_gate.py'
  pull_request:
    branches: [main]
    paths:
      - 'listings.json'
      - 'SUMMER.md'
      - 'OFFCYCLE.md'
      - 'NEWGRAD.md'
      - 'README.md'
      - '.github/scripts/validate_listings.py'
      - '.github/scripts/quality_gate.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate listings
        run: python .github/scripts/validate_listings.py
      - name: Quality / regression gate
        run: python .github/scripts/quality_gate.py
