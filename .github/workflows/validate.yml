name: Validate Listings

on:
  push:
    branches: [main]
    paths:
      - 'listings.json'
      - 'SUMMER.md'
      - 'OFFCYCLE.md'
      - 'NEWGRAD.md'
      - 'README.md'
      - '.github/scripts/validate_listings.py'
      - '.github/scripts/quality_gate.py'
      - '.github/scripts/scrape_jobs.py'
      - '.github/scripts/apply_pending.py'
      - '.github/scripts/scope_rules.py'
      - '.github/scripts/claude_board_prompts.py'
      - '.github/scripts/test_infer_listing_type.py'
      - '.github/scripts/test_claude_board_prompts.py'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'listings.json'
      - 'SUMMER.md'
      - 'OFFCYCLE.md'
      - 'NEWGRAD.md'
      - 'README.md'
      - '.github/scripts/validate_listings.py'
      - '.github/scripts/quality_gate.py'
      - '.github/scripts/scrape_jobs.py'
      - '.github/scripts/apply_pending.py'
      - '.github/scripts/scope_rules.py'
      - '.github/scripts/claude_board_prompts.py'
      - '.github/scripts/test_infer_listing_type.py'
      - '.github/scripts/test_claude_board_prompts.py'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install requests pyyaml
      - name: Validate listings
        run: python .github/scripts/validate_listings.py
      - name: Quality / regression gate
        run: python .github/scripts/quality_gate.py
      - name: Title classification regression tests
        run: python .github/scripts/test_infer_listing_type.py
      - name: Claude board prompt tests
        run: python .github/scripts/test_claude_board_prompts.py
